[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Ключевые настройки для N16R8 (16MB Flash, 8MB OPI PSRAM)
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
board_build.f_cpu = 240000000L

; Библиотеки
lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@2.5.43
    bitbank2/JPEGDEC@1.2.0
    arduino-libraries/ArduinoOTA@1.0.0

; Флаги сборки
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=14
    -DTFT_DC=45
    -DTFT_RST=48
    -DTFT_MOSI=47
    -DTFT_SCLK=21
    -DSPI_FREQUENCY=80000000

; Разрешаем использовать файлы из папки src как есть
build_src_filter = +<*>
