name: firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CORE_VER: "3.0.4"
  LVGL_TAG: "v9.2.2"
  LGFX_TAG: "1.2.0"
  CLI_VER: "1.1.1"
  ESPTOOL_VER: "4.8.1"
  SKETCH: "MiniOS"
  ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}/.arduino15
  ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/Arduino
  FQBN: "esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=default,CDCOnBoot=cdc,CPUFreq=240,DebugLevel=none"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          pip install "esptool==$ESPTOOL_VER"

      - name: Установка arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/arduino/arduino-cli/releases/download/v${CLI_VER}/arduino-cli_${CLI_VER}_Linux_64bit.tar.gz" | tar xz -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Ядро esp32
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$CORE_VER"

      - name: Библиотеки
        run: |
          mkdir -p "$ARDUINO_DIRECTORIES_USER/libraries"
          L="$ARDUINO_DIRECTORIES_USER/libraries"
          [ -d "$L/lvgl" ] || git clone --depth 1 --branch "$LVGL_TAG" https://github.com/lvgl/lvgl.git "$L/lvgl"
          [ -d "$L/LovyanGFX" ] || git clone --depth 1 --branch "$LGFX_TAG" https://github.com/lovyan03/LovyanGFX.git "$L/LovyanGFX"
          cp ci/lv_conf.h "$L/lv_conf.h"

      - name: Схема разделов
        run: |
          P="$ARDUINO_DIRECTORIES_DATA/packages/esp32/hardware/esp32/$CORE_VER"
          mkdir -p build
          python3 "$P/tools/gen_esp32part.py" --verify "$SKETCH/partitions.csv" build/partitions.bin
          cp "$SKETCH/partitions.csv" "$P/tools/partitions/default.csv"

      - name: Версия прошивки
        run: |
          V="0.1.0-b${{ github.run_number }}"
          printf '#pragma once\n#define FW_VERSION "%s"\n' "$V" > "$SKETCH/version.h"
          echo "FW_VER=$V" >> "$GITHUB_ENV"

      - name: Ассеты (видео и пак)
        run: |
          mkdir -p build/assets
          if [ -f "assets/intro.mp4" ]; then
            ffmpeg -y -hide_banner -loglevel error -i "assets/intro.mp4" -an -vf "fps=15,scale=320:-2,crop=320:240:0:ih*0.38" -c:v mjpeg -q:v 8 build/assets/intro_h.mjpeg
            ffmpeg -y -hide_banner -loglevel error -i "assets/intro.mp4" -an -vf "fps=15,scale=240:-2,crop=240:320:0:ih-320" -c:v mjpeg -q:v 8 build/assets/intro_v.mjpeg
          else
            echo "Заглушка: видео не найдено, сборка продолжится без него."
            touch build/assets/dummy.txt
          fi
          python3 ci/make_pak.py build/assets build/assets-pak.bin

      - name: Сборка
        run: |
          arduino-cli compile --fqbn "$FQBN" --export-binaries "$SKETCH" 2>&1 | tee build/build.log
          echo "=== Файлы в $SKETCH/build ==="
          find "$SKETCH/build" -name '*.bin' -type f 2>/dev/null || echo "Нет .bin"

      - name: Упаковка образов
        run: |
          P="$ARDUINO_DIRECTORIES_DATA/packages/esp32/hardware/esp32/$CORE_VER"
          mkdir -p dist
          
          APP=$(find "$SKETCH/build" -name '*.ino.bin' -type f 2>/dev/null | head -1)
          BOOT=$(find "$SKETCH/build" -name '*bootloader*.bin' -type f 2>/dev/null | head -1)
          
          echo "APP=$APP"
          echo "BOOT=$BOOT"
          
          if [ -z "$APP" ] || [ -z "$BOOT" ]; then
            echo "ОШИБКА: файлы прошивки не найдены. Смотри лог шага 'Сборка'."
            exit 1
          fi
          
          cp "$APP" dist/firmware-ota.bin
          cp "$BOOT" dist/bootloader.bin
          cp build/partitions.bin dist/partitions.bin
          cp "$P/tools/partitions/boot_app0.bin" dist/boot_app0.bin
          cp build/assets-pak.bin dist/assets-pak.bin
          python -m esptool --chip esp32s3 merge_bin -o dist/firmware-full.bin \
            0x0      dist/bootloader.bin \
            0x8000   dist/partitions.bin \
            0xe000   dist/boot_app0.bin \
            0x10000  dist/firmware-ota.bin \
            0x810000 dist/assets-pak.bin
          cd dist && for f in *.bin; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Размеры Flash/RAM
        run: |
          grep -E "Sketch uses|Global variables|Maximum is" build/build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: minios-${{ env.FW_VER }}
          path: dist/*

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Версия $FW_VER. firmware-full.bin — один раз по USB (адрес 0x0). firmware-ota.bin — обновления по Wi-Fi."
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/* --title "Сборка $FW_VER" --notes "$NOTES"

      - name: ТОЛЬКО ОШИБКИ (если упало)
        if: failure()
        run: |
          if [ -f build/build.log ]; then
            echo "=== ПОСЛЕДНИЕ 40 СТРОК ЛОГА СБОРКИ ==="
            tail -n 40 build/build.log
          fi
