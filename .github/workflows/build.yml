name: Build Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.16"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "AnimatedGIF"

      - name: Copy LVGL config
        run: |
          cp firmware/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Prepare clean sketch
        run: |
          echo "=== REAL FILES IN firmware/ ==="
          ls -la firmware
          mkdir -p sketch
          cp firmware/*.h sketch/
          cp firmware/*.cpp sketch/
          cp firmware/*.ino sketch/sketch.ino
          echo "=== CLEAN SKETCH ==="
          ls -la sketch

      - name: Build firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=huge_app,FlashMode=qio,FlashSize=16M,PSRAM=opi \
            --warnings default \
            --build-path ./build \
            --output-dir ./out \
            sketch

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            out/*.bin
            out/*.elf
