name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install libraries
        run: |
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "ArduinoOTA"

      - name: Create lv_conf.h
        run: |
          cat > src/lv_conf.h << 'EOF'
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_TICK_CUSTOM 1
          #define LV_TICK_CUSTOM_INCLUDE "Arduino.h"
          #define LV_TICK_CUSTOM_SYS_TIME_EXPR (millis())
          #define LV_MEM_CUSTOM 1
          #define LV_MEM_CUSTOM_INCLUDE <esp_heap_caps.h>
          #define LV_MEM_CUSTOM_ALLOC(size) heap_caps_malloc(size, MALLOC_CAP_SPIRAM)
          #define LV_MEM_CUSTOM_FREE(ptr) heap_caps_free(ptr)
          #define LV_MEM_CUSTOM_REALLOC(ptr, size) heap_caps_realloc(ptr, size, MALLOC_CAP_SPIRAM)
          #define LV_USE_GPU 0
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #endif
          EOF

      - name: Create font_cyrillic.c (заглушка)
        run: |
          cat > src/font_cyrillic.c << 'EOF'
          #include "font_cyrillic.h"
          // Временные шрифты для прохождения сборки. Замените на реальные!
          lv_font_t font_cyr_14 = { .get_glyph_dsc = NULL };
          lv_font_t font_cyr_20 = { .get_glyph_dsc = NULL };
          lv_font_t font_cyr_28 = { .get_glyph_dsc = NULL };
          EOF

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc" \
            --output-dir ./build \
            ./src

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./build/*.bin
